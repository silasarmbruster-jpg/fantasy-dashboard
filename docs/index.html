<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0d0f14">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="dot"></span> Fantasy HQ</div>
    <div id="nav-items"></div>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="theme-toggle"><i data-lucide="moon"></i> <span id="theme-toggle-label">Dark</span></button>
    </div>
  </nav>

  <main class="main" id="main">
    <div id="view-root"></div>
  </main>

  <nav class="mobile-tabbar" id="mobile-tabbar"></nav>
</div>

<div class="panel-backdrop" id="panel-backdrop"></div>
<aside class="detail-panel" id="detail-panel"></aside>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
