name: Dashboard aktualisieren

on:
  schedule:
    # Täglich um 5:30 UTC
    - cron: "30 5 * * *"
    # Zusätzlicher Lauf an NFL-Spieltagen (Do=4, So=0, Mo=1), abends UTC,
    # damit die finalen Ergebnisse des Spieltags mit einfließen.
    - cron: "30 23 * * 0,1,4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Dashboard bauen
        run: python3 build.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Keine Änderungen an docs/."
          else
            git commit -m "Dashboard-Daten aktualisiert ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
